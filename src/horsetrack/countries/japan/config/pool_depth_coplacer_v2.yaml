# The pool-depth study's co-placer variant re-registered on another rule (ticket #432, N3, review
# round 1; docs/specs/pool-depth-prereg.md, "Co-placer v2"), read by `horsetrack japan pool-depth
# freeze|run --spec pool_depth_coplacer_v2` (countries/japan/research/pool_depth.py).
#
# config/pool_depth.yaml (family japan-pool-depth-v1) froze the co-placer rule
# `jra-stake-back-share`, per yen 1 + (rV - sum W) / (P W_i), and its runs were recorded failed by
# their rule check. This family registers the co-placer variant alone on `core-stake-back-share`,
# the rule of core.pricing.stake_back_share_dividend (the stake-back-share rule as config/jra.yaml
# states it): per yen r(1 + (V - sum W) / (P W_i)), the payout rate taken on the whole net pool,
# the paying combinations' own money included. Every other key is config/pool_depth.yaml's, as
# frozen; the same gate (min_rule_match) decides the run's status. The keys are explained there.
# Frozen before its run; any edit after the freeze is another spec, which `run` refuses.
family_id: japan-pool-depth-coplacer-v2
date_from: "2014-06-07"
edges: [0.05, 0.1, 0.2]
share_lost: 0.5
quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
odds_bands:
  WIN: [2, 3, 5, 10, 20, 50]
  PLACE: [1.2, 1.5, 2, 3, 5, 10]
  QUINELLA: [5, 10, 20, 50, 100, 300]
  QUINELLA_PLACE: [2, 3, 5, 10, 20, 50, 100]
  FORECAST: [10, 20, 50, 100, 300, 1000]
  TRIO: [10, 30, 100, 300, 1000, 3000]
class_groups:
  DEBUT: newcomer
  MAIDEN: maiden
  C1: conditions
  C2: conditions
  C3: conditions
  OP: open
  L: open
  G1: graded
  G2: graded
  G3: graded
exclude_status: [abandoned]
pool_size_cells: tertiles
flat_stakes_yen: [1000, 10000, 30000]
minutes_before: 2.0
place_wide:
  variants: [co-placer]
  co_placer:
    rule: core-stake-back-share
    min_rule_match: 0.95
exacta_impact:
  pool: FORECAST
  stake: 100
  takeout: 0.25
  pool_bin_edges: [0, 500000, 1000000, 2000000, 5000000, 10000000, 20000000, 50000000]
