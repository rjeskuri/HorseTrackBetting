# Japan's availability rules: when each store table's rows are known at a decision time t
# (docs/specs/as-of.md, read by core.store.asof.load_availability). Every value here is an owner
# decision (08 §9.18; the owner's answer on #80, 2026-11-24), never an implementation ruling;
# change one only through a ticket the owner approves. Each rule is conservative relative to
# JRA's actual publication.
#
# races derive post_utc from race_date and post_time_local (Asia/Tokyo; #227). Since then the horse
# weights and the same-day going are in the views, null until post_utc - 60 min of their race, and
# the result tables enter the views at post_utc + 30 min of their race, read by race_id from races
# (the owner's answer on #80, 2026-11-24). A race without a post time never shows either. The
# result columns of races and runners stay label_columns. A table without an entry here is refused.
tables:
  # The board at t: the latest capture fetched by t. HKTrack rows have no fetched_utc, so their
  # snapshot_utc counts. The payout and the final-capture flag come from the whole day's log.
  odds_timeseries:
    kind: column
    column: fetched_utc
    fallback: snapshot_utc
    label_columns: [dividend, is_refund, is_final_capture]

  # The card: known from 00:00 JST of the race date.
  # Accepted leak (owner decision, 2026-11-25): meetings.status, races.field_size, races.status
  # and runners.is_scratched come from the results page, so a race-day scratch or abandonment is
  # in the views from 00:00 JST. They stay under that rule until the owner decides whether they
  # need a post-based one (#227; docs/specs/as-of.md, "Accepted leak: results-derived card
  # columns").
  meetings:
    kind: offset
    anchor: race_date
    tz: Asia/Tokyo
    offset_min: 0
  races:
    kind: offset
    anchor: race_date
    tz: Asia/Tokyo
    offset_min: 0
    # the post as a UTC instant: post_time_local ("H:MM" or "HH:MM") on the JST wall clock of the
    # race date; null where the post time is missing or malformed
    derived:
      post_utc: {date: race_date, time: post_time_local, tz: Asia/Tokyo}
    # same-day going: in the view, null until post_utc - 60 min
    gated_columns:
      - columns: [going, going_raw]
        anchor: post_utc
        offset_min: -60
    # field_size and status stay in the view: accepted leak (see above)
    # results; result_published_utc and result_unpublished_utc (#225): never in a view (owner
    # decision, answer on #80, 2026-11-25). rail_setting stays in.
    label_columns:
      - finish_time_s
      - split_times_s
      - result_published_utc
      - result_unpublished_utc
  runners:
    kind: offset
    anchor: race_date
    tz: Asia/Tokyo
    offset_min: 0
    # horse weights (kg, the change, the lb copy): in the view, null until post_utc - 60 min of the
    # runner's race
    gated_columns:
      - columns: [horse_wt_kg, horse_wt_change_kg, declared_horse_wt_lb]
        via: {table: races, match: [race_id]}
        anchor: post_utc
        offset_min: -60
    # is_scratched stays in the view: accepted leak (see above)
    # results
    label_columns:
      - finish_pos
      - placing_raw
      - placing_code
      - dead_heat
      - finish_time_s
      - lbw_raw
      - lbw_lengths
      - running_positions
      - last_3f_s
      - win_odds
      - win_fav_rank

  # Same-day results: from post_utc + 30 min of their race, read from races by race_id (#227).
  # read_label still returns them whole, as before #227.
  dividends:
    kind: offset
    via: {table: races, match: [race_id]}
    anchor: post_utc
    offset_min: 30
    read_label: true
  sectionals:
    kind: offset
    via: {table: races, match: [race_id]}
    anchor: post_utc
    offset_min: 30
    read_label: true
  incidents:
    kind: offset
    via: {table: races, match: [race_id]}
    anchor: post_utc
    offset_min: 30
    read_label: true
  running_comments:
    kind: offset
    via: {table: races, match: [race_id]}
    anchor: post_utc
    offset_min: 30
    read_label: true

  # Profile pages show today's values, not the values at t.
  horses:
    kind: current_value
  # Sire, dam and broodmare sire never change; the scrape's own columns stay out.
  horse_pedigree:
    kind: static
    label_columns: [source_race_id, scraped_utc]
  # A past run is known from 00:00 JST of the day after its race date.
  horse_runs:
    kind: offset
    anchor: race_date
    tz: Asia/Tokyo
    offset_min: 1440

  # JRDB: inputs in private models only (D21).
  jrdb_pre_race:
    kind: offset
    anchor: race_date
    tz: Asia/Tokyo
    offset_min: 0
    # TYB is JRDB's day-of file (race-day body weight, the board, same-day going, paddock): its
    # tyb_ columns are labels until a JRDB release-time rule exists (owner decision, answer on
    # #80, 2026-11-25). The kyi_, cyb_ and joa_ columns stay in the view.
    label_prefixes: [tyb_]
  jrdb_post_race:
    kind: label_only

  # Per-race Win sales (#278): each publication from its own time, published_utc. A live page's
  # figure is published at the page's clock, a final (最終オッズ) page's at its printed post + 30
  # min, or at its fetch when it prints no post time (the owner's answer on #278, rule A,
  # 2026-11-25).
  win_sales:
    kind: column
    column: published_utc
