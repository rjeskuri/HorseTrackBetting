# JRA payout-rate boosts by race and pool (tickets #76, #197), read by countries/japan/takeout.py.
#
# Transcribed 2026-11-24 and 2026-11-25 from the official JRA pages and the result PDFs they link:
#   https://www.jra.go.jp/kouza/premium/index.html (and result.html, <year>premium.html, the
#     campaign pages they link: 2sai-tanshou/, 3sai-spring/, kinpai-umaren/, kinpai-wide/,
#     60th-umaren/)
#   https://www.jra.go.jp/kouza/superpremium/index.html (and the per-day result PDFs)
#   https://www.jra.go.jp/kouza/ultrapremium/index.html (and result.html, 2024ultrapremium.html,
#     2025ultrapremium.html and their result PDFs)
# Only facts are kept here: dates, venues, race numbers, pools. Where a page names a race but not
# its number, the number was looked up in the race store by date, venue and race name (each lookup
# matched exactly one race).
#
# Entry: {kind, date, until?, age?, venue?, race_no?, pools?}. A missing venue, race_no or pools
# means every venue, race or pool that day. Venue and pool codes are jra.yaml's.
#   until: the entry covers every day from `date` to `until`, both included.
#   age:   the entry matches only races restricted to that age: the race's conditions label (the
#          store's race_class_raw) starts with "<age>歳" and is not an "<age>歳以上" label. The race
#          id does not carry it, so race_takeout needs the caller's race_class_raw for any race an
#          age entry could match, and raises RaceConditionsNeeded without it.
#   premium:       5% of sales added to the pool (JRA may withhold it when betting is extremely
#                  concentrated).
#   super_premium: every pool's payout rate set to 80%.
#   ultra_premium: super_premium plus the 5% premium on the same pools.
# Where a premium and a super_premium entry match the same race and pool, the two stack (80% + 5%),
# as the result PDFs show for 2022-12-28 and 2023-12-28.
#
# Coverage:
#   super_premium: every day the page lists, 2017-12-28 to 2026-10-10 (21 days). Each result PDF
#     covers all races at the venues it names; a venue is set only where the PDF names one venue.
#   ultra_premium: every race and day the page lists, 2024-2025 (JRA ran no Premium in those years;
#     its 2024-2025 programme was Ultra Premium). WIN5 is excluded on the 2024 GI-day races (the
#     page's note) and included on the two all-race days.
#   premium: 2014-06-29 to 2023-12-28, every campaign the pages list:
#       Day-wide campaigns (ダービーウィーク馬連 and the like) and single named races, as listed.
#       金杯 (中山金杯 and 京都金杯, 11R each): 馬連 2015-2021, ワイド 2022-2023. 2020-2023 pages give
#         no venue or race number: from the store (京都金杯 ran at 中京, CKY, 2021-2023).
#       最終馬連 (the 12R Quinella), autumn 2014 and spring and autumn 2015 and 2016: one entry per
#         venue the page lists for each day; the counts match each page's race total.
#       JRA60周年記念競走馬連 (2014, 11R each): race numbers from the store.
#       3歳重賞 (馬連 2017-2021, ワイド 2022-2023; listed races (L) included from 2021): one entry per
#         race the page names, 197 races; race numbers from the store; the counts match each page.
#       2歳単勝 (WIN on every 2-year-old race at every venue, stakes included): one age-2 entry per
#         window (summer 2015-2023, autumn 2017-2023), plus 12-28 in 2017-2019 and 2021. Against
#         the store, the races the entries boost match each page's race count in every window but
#         2019 autumn (see the gaps), and match race for race the result PDFs' lists (2015-2019
#         summer, 2017-2018 autumn).
#     The base rate is unknown before 2014-06-07, so spring 2014 and earlier campaigns are not listed.
#     Remaining gaps:
#       JRA60 2014-04-20 中山 皐月賞: before 2014-06-07, so not listed (race_takeout raises
#         TakeoutUnknown there).
#       2歳単勝 2019 autumn: the page states 439 races and gives no per-race list; the store holds
#         440 2-year-old races in the window (2019-09-07..12-15 and 12-28), all run. The typhoon
#         does not explain it: 4回東京 days 3 and 4 (due 10-12 and 10-13) ran on 10-15 and 10-21,
#         inside the window, with no race lost. Which race, if any, was not boosted is unknown, so
#         the age rule boosts all 440 (one of them may have paid the base rate).

