[project]
name = "HorseTrackBetting"
version = "0.1.0"
description = ""
requires-python = ">=3.10"
dependencies = [
    "arch>=9.0.0",
    "beautifulsoup4>=4.15.0",
    "duckdb>=1.5.6",
    "h2>=4.1",
    "httpx>=0.28",
    "lxml>=6.1.3",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "polars>=2.0.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "statsmodels>=0.15.0",
    "typer>=0.29.1",
]

[project.scripts]
horsetrack = "horsetrack.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horsetrack"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "local: needs real scraped pages under $HORSETRACK_DATA_DIR/fixtures; skipped when absent",
]
